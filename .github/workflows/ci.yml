name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "astro.config.ts"
      - "tailwind.config.ts"
      - "tsconfig.json"
      - "biome.json"
      - ".markdownlint.json"
      - ".markdownlintignore"
      - ".nvmrc"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "astro.config.ts"
      - "tailwind.config.ts"
      - "tsconfig.json"
      - "biome.json"
      - ".markdownlint.json"
      - ".markdownlintignore"
      - ".nvmrc"

permissions:
  contents: read

jobs:
  check:
    name: Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check & lint (astro check + biome)
        run: pnpm check
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0

      - name: Audit dependencies
        continue-on-error: true
        run: pnpm audit --audit-level=critical

      - name: Build
        run: pnpm build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
